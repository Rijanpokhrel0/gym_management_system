<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FitPulse - Multi-Admin Gym Management System">
  <title>FitPulse | Gym Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <style>
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .splash-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #E63946, #FF4D5A);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(230, 57, 70, 0.45);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-screen-bg"></div>

  <div class="splash-container">
    <div class="splash-logo">
      <i class="fa-solid fa-dumbbell"></i>
    </div>
    <h1 style="font-size: 1.8rem; margin-bottom: 6px;">FitPulse</h1>
    <p class="text-muted" style="margin-bottom: 24px;">Loading portal...</p>

    <div class="alert-box alert-danger" id="backend-error-box" style="display:none;max-width:480px;">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span><strong>Cannot reach backend at http://localhost/gym/.</strong> Ensure XAMPP Apache and MySQL are running.</span>
    </div>
  </div>

  <script src="assets/js/core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { checkSession, redirectToPortal } = window.Core;

      // Handle token queries if forwarded to root
      const params = new URLSearchParams(window.location.search);
      const verify = params.get('verify');
      const reset = params.get('reset');
      if (verify) {
        window.location.href = 'auth/verify-email.html?verify=' + encodeURIComponent(verify);
        return;
      }
      if (reset) {
        window.location.href = 'auth/reset-password.html?reset=' + encodeURIComponent(reset);
        return;
      }

      // Check current session
      const user = await checkSession();
      if (user && user.portal) {
        redirectToPortal(user.portal);
      } else {
        window.location.href = 'auth/login.html';
      }
    });
  </script>
</body>
</html>
