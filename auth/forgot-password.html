<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | FitPulse Gym Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-screen-bg"></div>

  <div class="auth-card-wrap">
    <div class="auth-card">
      <div class="auth-card-brand">
        <div class="auth-logo"><i class="fa-solid fa-dumbbell"></i></div>
        <h1>FitPulse</h1>
        <p class="auth-tagline">Password Recovery</p>
      </div>

      <div class="auth-card-body">
        <h3 class="auth-step-title">Forgot your password?</h3>
        <p class="auth-step-sub">Password resets are handled securely by the Superadmin. Please contact them directly to reset your account password.</p>

        <div class="auth-info-box" id="forgot-info">
          <i class="fa-solid fa-user-shield"></i>
          <div>
            <strong>Superadmin Contact</strong>
            <br><span id="forgot-sa-email">Loading contact details...</span>
          </div>
        </div>

        <a href="login.html" class="btn btn-ghost btn-block">
          <i class="fa-solid fa-arrow-left"></i> Back to Sign In
        </a>
      </div>
    </div>
  </div>

  <script src="../assets/js/core.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
