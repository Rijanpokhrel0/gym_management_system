<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | FitPulse Gym Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-screen-bg"></div>

  <div class="auth-card-wrap">
    <div class="auth-card">
      <div class="auth-card-brand">
        <div class="auth-logo"><i class="fa-solid fa-dumbbell"></i></div>
        <h1>FitPulse</h1>
        <p class="auth-tagline">Multi-Admin Gym Management System</p>
      </div>

      <div class="alert-box alert-danger" id="backend-error-box" style="display:none;margin:0 28px 16px;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span><strong>Cannot reach backend at http://localhost/gym/.</strong> Ensure XAMPP Apache and MySQL are running.</span>
      </div>

      <div class="auth-tabs">
        <a href="login.html" class="auth-tab-link active">Sign In</a>
        <a href="register.html" class="auth-tab-link">Register</a>
      </div>

      <div class="auth-card-body">
        <form id="form-login" novalidate>
          <div class="form-group">
            <label for="login-email">Email Address <span class="text-rose">*</span></label>
            <input type="email" id="login-email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password <span class="text-rose">*</span></label>
            <div class="password-field">
              <input type="password" id="login-password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="password-toggle" onclick="togglePassword('login-password', this)" tabindex="-1">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="auth-links-row">
            <a href="forgot-password.html">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="btn-submit-login">Sign In</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <a href="register.html" class="btn btn-outline btn-block">
          <i class="fa-solid fa-user-plus"></i> Create Member Account
        </a>
      </div>
    </div>
  </div>

  <script src="../assets/js/core.js"></script>
  <script src="login.js"></script>
</body>
</html>
