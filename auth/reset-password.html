<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | FitPulse Gym Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-screen-bg"></div>

  <div class="auth-card-wrap">
    <div class="auth-card">
      <div class="auth-card-brand">
        <div class="auth-logo"><i class="fa-solid fa-dumbbell"></i></div>
        <h1>FitPulse</h1>
        <p class="auth-tagline">Set New Password</p>
      </div>

      <div class="auth-card-body">
        <h3 class="auth-step-title">Choose a new password</h3>
        <p class="auth-step-sub">Enter and confirm your new password below.</p>

        <form id="form-reset" novalidate>
          <div class="form-group">
            <label for="reset-pass">New Password <span class="text-rose">*</span></label>
            <div class="password-field">
              <input type="password" id="reset-pass" class="form-control" placeholder="Min. 6 characters" required>
              <button type="button" class="password-toggle" onclick="togglePassword('reset-pass', this)" tabindex="-1">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="reset-pass2">Confirm Password <span class="text-rose">*</span></label>
            <div class="password-field">
              <input type="password" id="reset-pass2" class="form-control" placeholder="Repeat password" required>
              <button type="button" class="password-toggle" onclick="togglePassword('reset-pass2', this)" tabindex="-1">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="btn-submit-reset">Update Password</button>
        </form>

        <div style="margin-top: 16px;">
          <a href="login.html" class="btn btn-ghost btn-block">
            <i class="fa-solid fa-arrow-left"></i> Back to Sign In
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/core.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
